[platformio]
default_envs = main
src_dir = .
core_dir = ../.tools/platformio
build_cache_dir = ../.tools/build-cache

[env]
platform = espressif32 @ 8.0.0
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/limit-build-jobs.py
lib_deps = knolleary/PubSubClient @ 2.8
build_src_filter = -<*> +<src/main.cpp>

[env:main]

[env:wifi-ap]
build_src_filter = -<*> +<bai-tap/bai-01-wifi/access-point/main.cpp>

[env:wifi-station]
build_src_filter = -<*> +<bai-tap/bai-01-wifi/station/main.cpp>

[env:ble-server]
build_src_filter = -<*> +<bai-tap/bai-02-ble-server/main.cpp>

[env:espnow-transmitter]
build_src_filter = -<*> +<bai-tap/bai-03-esp-now/transmitter/main.cpp>

[env:espnow-receiver]
build_src_filter = -<*> +<bai-tap/bai-03-esp-now/receiver/main.cpp>

[env:web-server]
build_src_filter = -<*> +<bai-tap/bai-04-web-server/main.cpp>

[env:mqtt]
build_src_filter = -<*> +<bai-tap/bai-05-mqtt/main.cpp>
